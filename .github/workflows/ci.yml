name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: pulseboard, POSTGRES_PASSWORD: pulseboard, POSTGRES_DB: pulseboard_test }
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U pulseboard -d pulseboard_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://pulseboard:pulseboard@localhost:5432/pulseboard_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: 1.25.3 }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: docker build -t pulseboard .
